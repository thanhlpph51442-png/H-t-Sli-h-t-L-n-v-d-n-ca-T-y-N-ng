<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyCB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3B6F" />
      <stop offset="60%" stop-color="#4B779A" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="waterCB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="30%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="600" height="300" fill="url(#skyCB)" />
  <!-- Distant Karst Peaks -->
  <path d="M 0,220 Q 70,80 150,220 Q 230,110 320,220 Q 400,60 500,220 Q 560,130 600,220 L 600,300 L 0,300 Z" fill="#1C2D42" opacity="0.8" />
  <!-- Mid Peaks -->
  <path d="M 0,240 Q 90,140 180,240 Q 280,130 380,240 Q 470,120 600,240 L 600,300 L 0,300 Z" fill="#2D4A3E" />
  <!-- Ban Gioc Waterfall Flow -->
  <path d="M 220,160 L 230,250 L 370,250 L 380,160 Z" fill="#E2E8F0" opacity="0.6" />
  <line x1="240" y1="165" x2="245" y2="250" stroke="#FFF" stroke-width="2" stroke-dasharray="8 4" />
  <line x1="270" y1="162" x2="275" y2="250" stroke="#FFF" stroke-width="3" stroke-dasharray="12 4" />
  <line x1="300" y1="160" x2="300" y2="250" stroke="#FFF" stroke-width="4" stroke-dasharray="15 3" />
  <line x1="330" y1="162" x2="335" y2="250" stroke="#FFF" stroke-width="3" stroke-dasharray="10 4" />
  <line x1="360" y1="165" x2="365" y2="250" stroke="#FFF" stroke-width="2" stroke-dasharray="6 3" />
  <!-- Water basin -->
  <rect y="245" width="600" height="55" fill="url(#waterCB)" />
  <!-- Traditional Tay Stilt House Silhouette -->
  <g transform="translate(430, 195) scale(0.65)" fill="#3D2314">
    <!-- Roof -->
    <polygon points="50,0 0,40 100,40" fill="#8B2500" />
    <rect x="15" y="40" width="70" height="25" />
    <!-- Stilts -->
    <line x1="20" y1="65" x2="20" y2="90" stroke="#3D2314" stroke-width="4" />
    <line x1="40" y1="65" x2="40" y2="90" stroke="#3D2314" stroke-width="4" />
    <line x1="60" y1="65" x2="60" y2="90" stroke="#3D2314" stroke-width="4" />
    <line x1="80" y1="65" x2="80" y2="90" stroke="#3D2314" stroke-width="4" />
  </g>
  <!-- Foreground Brocade Trim -->
  <line x1="0" y1="294" x2="600" y2="294" stroke="#D4AF37" stroke-width="3" />
  <text x="30" y="50" font-family="'Noto Serif', serif" font-weight="bold" font-size="28" fill="#FAF6F0">CAO BẰNG</text>
  <text x="30" y="75" font-family="sans-serif" font-size="14" fill="#D4AF37" letter-spacing="2">CÁI NÔI LƯỢN SLƯƠNG &amp; NÀNG HAI</text>
</svg>

