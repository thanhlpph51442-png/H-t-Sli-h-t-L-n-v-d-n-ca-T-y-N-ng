<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="gourdGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E09F3E" />
      <stop offset="50%" stop-color="#9E2A2B" />
      <stop offset="100%" stop-color="#3D2314" />
    </radialGradient>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3A21" />
      <stop offset="50%" stop-color="#3D2314" />
      <stop offset="100%" stop-color="#211007" />
    </linearGradient>
    <radialGradient id="soundGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1C2D42" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sound Ripple Rings -->
  <circle cx="280" cy="330" r="140" fill="url(#soundGlow)" />
  <circle cx="280" cy="330" r="110" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="280" cy="330" r="85" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.8" />

  <!-- Traditional Brocade Halo Background -->
  <g transform="translate(280, 330) scale(0.9)" opacity="0.4">
    <circle cx="0" cy="0" r="95" fill="none" stroke="#9E2A2B" stroke-width="20" stroke-dasharray="10 5" />
    <polygon points="0,-95 24,-24 95,0 24,24 0,95 -24,24 -95,0 -24,-24" fill="none" stroke="#D4AF37" stroke-width="2" />
  </g>

  <!-- ĐÀN TÍNH BODY -->
  <!-- Long Wooden Neck (Cần đàn) -->
  <g filter="url(#softShadow)">
    <line x1="80" y1="50" x2="310" y2="370" stroke="url(#neckGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Neck headstock (Mõm đàn hình búp hoa hồi hoặc chim phượng cách điệu) -->
    <path d="M 80,50 C 65,30 45,35 40,55 C 35,75 55,80 75,65 Z" fill="#D4AF37" stroke="#3D2314" stroke-width="2" />
    <!-- Pegs (Khóa đàn bằng gỗ tiện) -->
    <circle cx="68" cy="45" r="7" fill="#8B2500" stroke="#FAF6F0" stroke-width="1.5" />
    <rect x="62" y="38" width="12" height="4" fill="#D4AF37" rx="2" />
    <circle cx="90" cy="70" r="7" fill="#8B2500" stroke="#FAF6F0" stroke-width="1.5" />
    <rect x="84" y="63" width="12" height="4" fill="#D4AF37" rx="2" />

    <!-- Red Silk Tassel (Tua rua chỉ đỏ may mắn của người Tày) -->
    <g transform="translate(42, 58)">
      <path d="M 0,0 C -5,20 -10,35 -8,55 C -5,40 5,30 0,0" fill="#9E2A2B" opacity="0.9" />
      <line x1="-3" y1="10" x2="-8" y2="55" stroke="#D4AF37" stroke-width="1" />
      <line x1="0" y1="10" x2="-5" y2="58" stroke="#FAF6F0" stroke-width="1" />
    </g>

    <!-- Gourd Body (Bầu đàn tròn bằng quả bầu già hong khói) -->
    <circle cx="280" cy="330" r="68" fill="url(#gourdGrad)" stroke="#211007" stroke-width="3" />
    <!-- Wooden Soundboard (Mặt đàn bằng gỗ vông mềm) -->
    <ellipse cx="280" cy="330" rx="56" ry="58" fill="#F5EBE1" opacity="0.92" stroke="#3D2314" stroke-width="2" />
    
    <!-- Sound Holes (Lỗ thoát âm hình hoa sen & mặt trời) -->
    <circle cx="258" cy="315" r="4" fill="#3D2314" />
    <circle cx="250" cy="328" r="3" fill="#3D2314" />
    <circle cx="262" cy="340" r="3.5" fill="#3D2314" />
    <circle cx="302" cy="315" r="4" fill="#3D2314" />
    <circle cx="310" cy="328" r="3" fill="#3D2314" />
    <circle cx="298" cy="340" r="3.5" fill="#3D2314" />

    <!-- Bridge (Ngựa đàn bằng tre) -->
    <rect x="272" y="348" width="16" height="4" fill="#5C3A21" rx="1" stroke="#211007" stroke-width="0.8" />

    <!-- 2 Silk Strings (Hai dây tơ đàn tính) -->
    <line x1="75" y1="58" x2="276" y2="350" stroke="#FAF6F0" stroke-width="1.8" />
    <line x1="82" y1="67" x2="284" y2="350" stroke="#FAF6F0" stroke-width="1.8" />
    <!-- Tailpiece (Chốt móc dây đuôi bầu đàn) -->
    <line x1="276" y1="350" x2="310" y2="390" stroke="#D4AF37" stroke-width="1.5" />
    <line x1="284" y1="350" x2="312" y2="390" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="311" cy="390" r="4" fill="#3D2314" />
  </g>

  <!-- Shimmering Silver Bells (Chùm xóc nhạc bạc của Bà Then) -->
  <g transform="translate(140, 150)">
    <circle cx="0" cy="0" r="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
    <circle cx="12" cy="8" r="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
    <circle cx="-10" cy="10" r="6.5" fill="#CBD5E1" stroke="#64748B" stroke-width="1" />
    <path d="M -15,16 Q 0,22 15,14" fill="none" stroke="#D4AF37" stroke-width="1.5" />
  </g>

  <!-- Musical Notes floating -->
  <g fill="#D4AF37" opacity="0.85">
    <path d="M 380,240 C 380,230 395,225 405,235 C 410,220 425,225 420,240 C 400,245 385,255 380,240 Z" />
    <circle cx="370" cy="220" r="4" />
    <circle cx="430" cy="190" r="5" />
    <line x1="374" y1="220" x2="374" y2="185" stroke="#D4AF37" stroke-width="2" />
    <line x1="435" y1="190" x2="435" y2="155" stroke="#D4AF37" stroke-width="2" />
    <path d="M 374,185 Q 405,170 435,155" stroke="#D4AF37" stroke-width="3" fill="none" />
  </g>
</svg>

