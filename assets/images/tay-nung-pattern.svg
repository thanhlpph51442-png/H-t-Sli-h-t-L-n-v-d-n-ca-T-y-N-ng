<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <defs>
    <linearGradient id="brocadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B2500" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#1B4332" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B2500" />
    </linearGradient>
    <pattern id="tayDiamond" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#1C2D42" />
      <!-- Diamond outline -->
      <polygon points="20,2 38,20 20,38 2,20" fill="none" stroke="#D4AF37" stroke-width="1.5" />
      <!-- Inner Diamond -->
      <polygon points="20,8 32,20 20,32 8,20" fill="#8B2500" stroke="#FAF6F0" stroke-width="0.8" />
      <!-- Center 8-pointed star flower -->
      <circle cx="20" cy="20" r="3" fill="#D4AF37" />
      <path d="M 20,13 L 20,27 M 13,20 L 27,20 M 15,15 L 25,25 M 15,25 L 25,15" stroke="#FAF6F0" stroke-width="1" />
      <!-- Corner triangles -->
      <polygon points="0,0 6,0 0,6" fill="#D4AF37" />
      <polygon points="40,0 34,0 40,6" fill="#D4AF37" />
      <polygon points="0,40 6,40 0,34" fill="#D4AF37" />
      <polygon points="40,40 34,40 40,34" fill="#D4AF37" />
    </pattern>
  </defs>

  <!-- Background Pattern -->
  <rect width="800" height="120" fill="url(#tayDiamond)" />
  
  <!-- Top decorative border -->
  <rect x="0" y="0" width="800" height="6" fill="url(#brocadeGrad)" />
  <line x1="0" y1="8" x2="800" y2="8" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4 2" />

  <!-- Bottom decorative border -->
  <line x1="0" y1="112" x2="800" y2="112" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4 2" />
  <rect x="0" y="114" width="800" height="6" fill="url(#brocadeGrad)" />
</svg>

