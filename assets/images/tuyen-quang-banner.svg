<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyTQ" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="50%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="riverGam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="30%" stop-color="#40916C" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#skyTQ)" />
  <!-- Pac Ta Mountain (Núi Pác Tạ hình chú voi) & Na Hang Karsts -->
  <path d="M 0,200 Q 120,80 240,200 Q 340,60 460,200 Q 530,120 600,200 L 600,300 L 0,300 Z" fill="#081C15" opacity="0.85" />
  <!-- Landmark Coc Vai Pha (Cọc Vài Phạ - Cọc buộc trâu trời) -->
  <path d="M 370,100 L 385,210 L 360,210 Z" fill="#2D6A4F" stroke="#D4AF37" stroke-width="1.5" />
  <!-- Gam River Basin -->
  <rect y="190" width="600" height="110" fill="url(#riverGam)" />
  <!-- Bamboo Raft (Bè mảng sông Gâm) -->
  <g transform="translate(180, 220) scale(0.9)">
    <line x1="0" y1="15" x2="100" y2="15" stroke="#D4AF37" stroke-width="4" />
    <line x1="10" y1="12" x2="90" y2="12" stroke="#5C3A21" stroke-width="3" />
    <!-- Stilt hut on raft -->
    <rect x="35" y="-5" width="30" height="18" fill="#8B2500" />
    <polygon points="30,-5 50,-18 70,-5" fill="#D4AF37" />
  </g>
  <!-- Foreground Trim -->
  <line x1="0" y1="294" x2="600" y2="294" stroke="#D4AF37" stroke-width="3" />
  <text x="30" y="50" font-family="'Noto Serif', serif" font-weight="bold" font-size="28" fill="#FAF6F0">TUYÊN QUANG</text>
  <text x="30" y="75" font-family="sans-serif" font-size="14" fill="#D4AF37" letter-spacing="2">LƯỢN CỌI CHIÊM HÓA &amp; LƯỢN QUAN LÀNG</text>
</svg>

